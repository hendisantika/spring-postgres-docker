# Build and test the project with Maven on JDK 25.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # required by the dependency submission step

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # full history for git-commit-id-plugin
    - name: Set up JDK 25
      uses: actions/setup-java@v6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build and test with Maven
      run: ./mvnw -B verify --file pom.xml

    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts
    - name: Update dependency graph
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
